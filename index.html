<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大模型多维对比总览</title>
<style>
/* ============================================================
   Design System v3 — Deep Space × Liquid Glass（深空黑金）
   基于 ui-ux-pro-max #7 Dark OLED + #3 Glassmorphism + #51 HUD
   动画层：ui-motion（滚动/光标连续动效）+ ui-interaction（状态迁移）
   ============================================================ */
:root{
  --bg:#070B14; --bg2:#0B1120; --bg3:#101830;
  --card:rgba(255,255,255,.04); --card2:rgba(255,255,255,.075); --card3:rgba(255,255,255,.11);
  --glass:rgba(16,24,48,.55);
  --line:rgba(255,255,255,.09); --line-strong:rgba(255,255,255,.16);
  --ink:#F1F4FB; --muted:#8A94AC; --dim:#5A6478;
  --gold:#F5C96B; --gold2:#FFE3A3; --gold-dim:rgba(245,201,107,.14);
  --cyan:#4FD8FF; --cyan-dim:rgba(79,216,255,.12);
  --violet:#8B7CFF; --violet-dim:rgba(139,124,255,.12);
  --s:#F5C96B; --a:#4FD8FF; --b:#34E5A0; --c:#7A87A6;
  --s-dim:rgba(245,201,107,.16); --a-dim:rgba(79,216,255,.14);
  --b-dim:rgba(52,229,160,.13); --c-dim:rgba(122,135,166,.13);
  --ok:#34E5A0; --warn:#FFB020; --danger:#FF5470;
  --r:16px; --r-lg:22px; --r-sm:10px;
  --shadow:0 20px 60px rgba(0,0,0,.5);
  --font:"Inter","HarmonyOS Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
/* ===== 白天模式（html[data-theme="light"] 变量覆盖）===== */
html[data-theme="light"]{
  --bg:#F4F6FB; --bg2:#EEF1F8; --bg3:#E3E8F3;
  --card:rgba(255,255,255,.72); --card2:rgba(255,255,255,.92); --card3:#FFFFFF;
  --glass:rgba(255,255,255,.78);
  --line:rgba(22,32,64,.10); --line-strong:rgba(22,32,64,.20);
  --ink:#182136; --muted:#5A6478; --dim:#8A94AC;
  --gold:#B8860B; --gold2:#8F6500; --gold-dim:rgba(184,134,11,.13);
  --cyan:#0284C7; --cyan-dim:rgba(2,132,199,.10);
  --violet:#6D5BD0; --violet-dim:rgba(109,91,208,.10);
  --s:#B8860B; --a:#0284C7; --b:#059669; --c:#64748B;
  --s-dim:rgba(184,134,11,.14); --a-dim:rgba(2,132,199,.12);
  --b-dim:rgba(5,150,105,.12); --c-dim:rgba(100,116,139,.14);
  --ok:#059669; --warn:#D97706; --danger:#DC2626;
  --shadow:0 12px 40px rgba(24,33,54,.12);
}
/* light 下背景光晕/点阵调淡 */
html[data-theme="light"] body::before{opacity:.55}
html[data-theme="light"] body::after{background-image:radial-gradient(rgba(24,33,54,.05) 1px,transparent 1px)}
/* light 下玻璃/特殊元素 */
html[data-theme="light"] .toolbar{background:rgba(255,255,255,.82);box-shadow:0 10px 34px rgba(24,33,54,.10)}
html[data-theme="light"] thead th{background:rgba(238,241,248,.85)}
html[data-theme="light"] .modal{background:linear-gradient(165deg,#FFFFFF,#F2F5FB);border-color:rgba(184,134,11,.28);box-shadow:0 24px 80px rgba(24,33,54,.22)}
html[data-theme="light"] .chart-tip{background:rgba(255,255,255,.97);border-color:rgba(184,134,11,.32);box-shadow:0 12px 40px rgba(24,33,54,.16)}
html[data-theme="light"] .reco{background:linear-gradient(135deg,rgba(184,134,11,.08),rgba(2,132,199,.04))}
html[data-theme="light"] .live-head{background:linear-gradient(135deg,rgba(5,150,105,.07),rgba(2,132,199,.05))}
html[data-theme="light"] .stat-hero .hero-num{background:linear-gradient(115deg,#C9A227,var(--gold) 55%,#9A6A00);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
html[data-theme="light"] .hero h1{background:linear-gradient(115deg,#6B4E00 10%,#B8860B 38%,#8F6500 60%,#C9A227 90%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;filter:none}
html[data-theme="light"] .donut-center .dc-num{color:var(--ink)}
html[data-theme="light"] .mcard{background:rgba(255,255,255,.75);box-shadow:0 6px 24px rgba(24,33,54,.07)}
html[data-theme="light"] .toolcard{background:rgba(255,255,255,.75);box-shadow:0 6px 24px rgba(24,33,54,.07)}
html[data-theme="light"] .live-card{background:rgba(255,255,255,.75)}
html[data-theme="light"] .stat{background:rgba(255,255,255,.7)}
html[data-theme="light"] .mcard:hover,.toolcard:hover{border-color:rgba(184,134,11,.4);box-shadow:0 14px 40px rgba(24,33,54,.12)}
html[data-theme="light"] .fgroup{background:rgba(24,33,54,.04);border-color:rgba(22,32,64,.12)}
html[data-theme="light"] .searchbox,.sortbox{background:rgba(255,255,255,.85);border-color:rgba(22,32,64,.15);color:var(--ink)}
html[data-theme="light"] .sortbox option{background:#fff}
html[data-theme="light"] .bs-track{background:rgba(24,33,54,.06)}
html[data-theme="light"] .mcard .mc-best{color:#3A4660}
html[data-theme="light"] .mcard .mc-vendor{color:#6B7690}
html[data-theme="light"] .mcard .mc-tags .tag{background:rgba(24,33,54,.05);color:#4A5670;border-color:rgba(24,33,54,.12)}
html[data-theme="light"] .mcard .mc-tags .tag.think{background:rgba(184,134,11,.1);color:#8F6500;border-color:rgba(184,134,11,.3)}
html[data-theme="light"] .tip-models .tm{background:rgba(24,33,54,.05);border-color:rgba(24,33,54,.12);color:#4A5670}
html[data-theme="light"] .chart-tip .tip-models{color:#3A4660}
html[data-theme="light"] .radar-labels .rl-row{color:#5A6478}
html[data-theme="light"] .radar-labels .rl-row b{color:var(--ink)}
html[data-theme="light"] .barstack .bs-row{color:#5A6478}
html[data-theme="light"] .t-eco{background:rgba(2,132,199,.08);border-color:rgba(2,132,199,.3);color:#3A4660}
html[data-theme="light"] .t-eco b{color:#0284C7}
/* light 下 SVG 图表元素（网格线/轴线/雷达） */
html[data-theme="light"] .radar-svg polygon[fill="none"], html[data-theme="light"] .radar-svg line{stroke:rgba(24,33,54,.14)!important}
html[data-theme="light"] .donut-arc{filter:none}
html[data-theme="light"] .dc-num{color:var(--ink)}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.6;overflow-x:hidden;-webkit-font-smoothing:antialiased}
/* 深空背景：多层光晕缓慢漂移 */
body::before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;
  background:
    radial-gradient(1000px 600px at 80% -10%, rgba(245,201,107,.09), transparent 60%),
    radial-gradient(800px 600px at -10% 20%, rgba(79,216,255,.06), transparent 55%),
    radial-gradient(700px 500px at 100% 80%, rgba(139,124,255,.05), transparent 60%),
    radial-gradient(500px 400px at 30% 110%, rgba(245,201,107,.05), transparent 55%);
  animation:aurora 26s ease-in-out infinite alternate}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background-image:radial-gradient(rgba(255,255,255,.028) 1px,transparent 1px);
  background-size:34px 34px;
  mask-image:radial-gradient(ellipse 90% 60% at 50% 0%,#000 30%,transparent 75%)}
@keyframes aurora{0%{transform:translate(0,0) scale(1)}50%{transform:translate(-2%,3%) scale(1.05)}100%{transform:translate(2%,-2%) scale(1.02)}}
a{color:var(--cyan);text-decoration:none}

/* 滚动条 */
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:#232c44;border-radius:6px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:#33405f}

/* ===== Hero（顶部）===== */
.hero{position:relative;max-width:1280px;margin:0 auto;padding:56px 24px 26px;text-align:center;overflow:hidden}
.hero .orb{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5;pointer-events:none;animation:orbFloat 9s ease-in-out infinite}
.hero .orb.o1{width:340px;height:340px;background:rgba(245,201,107,.16);top:-140px;left:12%}
.hero .orb.o2{width:280px;height:280px;background:rgba(79,216,255,.12);top:-90px;right:14%;animation-delay:-4s}
.hero .orb.o3{width:220px;height:220px;background:rgba(139,124,255,.13);bottom:-120px;left:42%;animation-delay:-2s}
@keyframes orbFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(26px)}}
.hero-badge{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--gold2);background:var(--gold-dim);border:1px solid rgba(245,201,107,.3);border-radius:999px;padding:5px 14px;margin-bottom:20px;letter-spacing:.4px;backdrop-filter:blur(8px)}
.hero-badge .pulse-dot{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok);animation:pulse 1.8s infinite}
.hero h1{font-size:clamp(30px,5vw,52px);font-weight:900;letter-spacing:1px;line-height:1.15;
  background:linear-gradient(115deg,#FFF6E0 10%,var(--gold) 38%,#E89B3C 60%,#FFE3A3 90%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 4px 30px rgba(245,201,107,.18))}
.hero .sub{margin-top:14px;font-size:15px;color:var(--muted);max-width:640px;margin-left:auto;margin-right:auto;line-height:1.8}
.hero .sub b{color:var(--ink)}
.hero-updated{margin-top:12px;font-size:12px;color:var(--dim)}
.hero-updated .dot{color:var(--gold)}
.fx-badge{display:inline-flex;align-items:center;gap:5px;margin-left:10px;background:var(--cyan-dim);border:1px solid rgba(79,216,255,.3);color:var(--cyan);border-radius:999px;padding:2px 12px;font-size:11.5px}
.fx-badge b{font-weight:800;font-variant-numeric:tabular-nums}
.fx-badge .fx-src{opacity:.7;font-size:10.5px}

/* ===== 统计图表区（v3.1 图表化）===== */
.stats{max-width:1280px;margin:8px auto 0;padding:0 24px;display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.stat{position:relative;background:var(--glass);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;backdrop-filter:blur(14px);overflow:hidden;transition:all .3s}
.stat::before{content:"";position:absolute;inset:0;background:radial-gradient(200px 100px at 50% 0%,rgba(245,201,107,.08),transparent 70%);opacity:0;transition:opacity .3s}
.stat:hover::before{opacity:1}
.stat:hover{border-color:var(--line-strong);transform:translateY(-3px)}
.stat .stat-title{font-size:11px;color:var(--muted);letter-spacing:.8px;text-transform:uppercase;margin-bottom:10px;display:flex;align-items:center;gap:6px}
/* 主数字卡 */
.stat-hero{display:flex;align-items:center;gap:14px}
.stat-hero .hero-num{font-size:44px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums;background:linear-gradient(115deg,var(--gold2),var(--gold) 55%,#E89B3C);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.stat-hero .hero-sub{margin-top:6px;font-size:12px;color:var(--muted)}
.stat-hero .hero-sub b{color:var(--cyan);font-size:15px}
.stat-hero .hero-sub .sub-item{display:flex;align-items:center;gap:5px;margin-top:2px}
/* 环形图卡 */
.donut-wrap{display:flex;align-items:center;gap:12px}
.donut-box{position:relative;width:96px;height:96px;flex-shrink:0}
.donut-box svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut-arc{stroke-linecap:butt;animation:segIn 1.1s cubic-bezier(.22,1,.36,1) forwards}
@keyframes segIn{from{stroke-dasharray:0 500}to{stroke-dasharray:var(--len) 500}}
.donut-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.donut-center .dc-num{font-size:21px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.donut-center .dc-lbl{font-size:9px;color:var(--dim);letter-spacing:.5px;margin-top:2px}
.donut-legend{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px}
.donut-legend .dl-row{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--muted)}
.donut-legend .dl-dot{width:9px;height:9px;border-radius:3px;flex-shrink:0}
.donut-legend .dl-row b{margin-left:auto;color:var(--ink);font-variant-numeric:tabular-nums}
.donut-legend .dl-row .dl-pct{color:var(--dim);font-size:10.5px;width:34px;text-align:right}
/* 堆叠条卡 */
.barstack{margin-top:2px}
.barstack .bs-track{display:flex;height:14px;border-radius:7px;overflow:hidden;background:rgba(255,255,255,.05);gap:2px}
.barstack .bs-seg{height:100%;transition:flex-grow 1.1s cubic-bezier(.22,1,.36,1);flex-grow:0;cursor:pointer}
.barstack .bs-seg:hover{filter:brightness(1.25)}
.barstack .bs-row{display:flex;align-items:center;gap:7px;margin-top:7px;font-size:11.5px;color:var(--muted)}
.barstack .bs-row .bs-dot{width:9px;height:9px;border-radius:3px;flex-shrink:0}
.barstack .bs-row b{margin-left:auto;color:var(--ink);font-variant-numeric:tabular-nums}
.barstack .bs-row .bs-pct{color:var(--dim);font-size:10.5px;width:34px;text-align:right}

/* ===== 图表悬浮提示（chart tooltip）===== */
.chart-tip{position:fixed;z-index:200;pointer-events:none;opacity:0;transform:translateY(6px);transition:opacity .18s,transform .18s;max-width:280px;
  background:rgba(10,15,30,.96);border:1px solid rgba(245,201,107,.35);border-radius:12px;padding:10px 14px;
  box-shadow:0 12px 40px rgba(0,0,0,.55),0 0 20px rgba(245,201,107,.06);backdrop-filter:blur(14px)}
.chart-tip.show{opacity:1;transform:translateY(0)}
.chart-tip .tip-title{font-size:12px;font-weight:800;color:var(--gold2);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.chart-tip .tip-dot{width:8px;height:8px;border-radius:3px;flex-shrink:0}
.chart-tip .tip-models{font-size:11.5px;color:#C3CCE0;line-height:1.75}
.chart-tip .tip-models .tm{display:inline-block;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);border-radius:6px;padding:1px 7px;margin:1px 3px 1px 0}
.chart-tip .tip-more{font-size:10.5px;color:var(--dim);margin-top:4px}
.chart-tip .tip-notes{font-size:11px;color:var(--muted);margin-top:7px;line-height:1.65;border-top:1px dashed rgba(255,255,255,.09);padding-top:6px;max-height:64px;overflow:hidden}
/* 环形图弧线 hover 命中 */
.donut-arc{cursor:pointer}
.donut-arc:hover{filter:brightness(1.2) drop-shadow(0 0 6px rgba(245,201,107,.35))}

/* ===== 导航工具条（sticky 玻璃）===== */
.toolbar{position:sticky;top:14px;z-index:60;max-width:1280px;margin:22px auto 0;padding:12px 16px;
  background:rgba(11,17,32,.75);backdrop-filter:blur(20px) saturate(150%);-webkit-backdrop-filter:blur(20px) saturate(150%);
  border:1px solid var(--line);border-radius:18px;box-shadow:0 12px 40px rgba(0,0,0,.4)}
.tb-row1{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.viewtab{padding:8px 18px;border-radius:11px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--muted);cursor:pointer;font-size:13px;font-weight:600;transition:all .25s;position:relative;overflow:hidden}
.viewtab:hover{color:var(--ink);border-color:var(--line-strong)}
.viewtab.on{background:linear-gradient(135deg,rgba(245,201,107,.92),rgba(232,155,60,.9));color:#0A0E1A;font-weight:800;border-color:transparent;box-shadow:0 4px 22px rgba(245,201,107,.35)}
.viewtab .live-dot-inline{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ok);margin-right:5px;animation:pulse 2s infinite}
.viewtab .badge-count{font-size:10px;background:rgba(0,0,0,.18);border-radius:999px;padding:1px 7px;margin-left:5px;font-weight:700}
.viewtab.on .badge-count{background:rgba(0,0,0,.16)}
.tb-row2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.fgroup{display:flex;align-items:center;gap:3px;background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:11px;padding:4px 8px;font-size:12px;color:var(--muted)}
.fgroup>span{opacity:.6;margin-right:3px;font-size:11px}
.fgroup .fbtn{cursor:pointer;padding:4px 9px;border-radius:8px;transition:all .18s;white-space:nowrap;background:none;border:none;color:var(--muted);font-size:12px;font-family:inherit;line-height:inherit;position:relative}
.fgroup .fbtn:hover{background:var(--card2);color:var(--ink)}
.fgroup .fbtn.on{background:var(--gold-dim);color:var(--gold2);font-weight:700;box-shadow:inset 0 0 0 1px rgba(245,201,107,.4),0 0 16px rgba(245,201,107,.14)}
.fgroup .fbtn.on.vendor-美国{background:var(--cyan-dim);color:var(--cyan);box-shadow:inset 0 0 0 1px rgba(79,216,255,.4),0 0 16px rgba(79,216,255,.14)}
.fgroup .fbtn.on.vendor-中国{background:rgba(255,84,112,.13);color:#FF8BA0;box-shadow:inset 0 0 0 1px rgba(255,84,112,.4)}
.fgroup .fbtn.ripple::after{content:"";position:absolute;inset:0;border-radius:8px;background:radial-gradient(circle at var(--rx,50%) var(--ry,50%),rgba(255,255,255,.35),transparent 40%);opacity:0;transition:opacity .4s;pointer-events:none}
.fgroup .fbtn.ripple.on::after{opacity:1}
.searchbox{flex:1;min-width:200px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:11px;padding:9px 16px;color:var(--ink);font-size:13px;outline:none;transition:all .25s;backdrop-filter:blur(8px)}
.searchbox::placeholder{color:var(--dim)}
.searchbox:focus{border-color:rgba(245,201,107,.55);box-shadow:0 0 0 3px rgba(245,201,107,.1);background:rgba(255,255,255,.055)}
.sortbox{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:11px;padding:8px 12px;color:var(--ink);font-size:12.5px;outline:none;cursor:pointer}
.sortbox option{background:var(--bg2)}

/* ===== 推荐横幅 ===== */
.reco{margin-bottom:18px;background:linear-gradient(135deg,rgba(245,201,107,.09),rgba(79,216,255,.05));border:1px solid rgba(245,201,107,.3);border-radius:var(--r-lg);padding:18px 20px;backdrop-filter:blur(14px);animation:riseIn .5s ease both}
.reco-head{font-size:14.5px;font-weight:800;color:var(--gold2);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.reco-reason{display:block;font-size:12.5px;color:var(--muted);font-weight:400;margin-top:5px;line-height:1.7}
.reco-chips{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.reco-chip{display:flex;align-items:center;gap:9px;background:rgba(7,11,20,.6);border:1px solid var(--line);border-radius:13px;padding:10px 14px;cursor:pointer;transition:all .22s;max-width:100%;animation:riseIn .5s ease both}
.reco-chip:hover{border-color:var(--gold);transform:translateY(-3px) scale(1.02);box-shadow:0 8px 26px rgba(245,201,107,.16)}
.reco-chip b{font-size:13px;white-space:nowrap}
.reco-chip i{font-style:normal;font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:240px}
.reco-tip{margin-top:11px;font-size:11.5px;color:var(--dim)}

/* ===== 主区域 ===== */
main{max-width:1280px;margin:18px auto 56px;padding:0 24px;min-height:40vh}

/* ===== 视图切换动画 ===== */
.view-enter{animation:viewFade .45s cubic-bezier(.22,1,.36,1) both}
@keyframes viewFade{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}

/* ===== 模型卡片网格（主视图 v3）===== */
.cards-wrap{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px;perspective:1200px}
.mcard{position:relative;background:var(--glass);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px 18px 15px;cursor:pointer;
  transition:transform .28s cubic-bezier(.22,1,.36,1),box-shadow .28s,border-color .28s;
  backdrop-filter:blur(14px);overflow:hidden;
  transform-style:preserve-3d;will-change:transform}
.mcard::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .35s;
  background:radial-gradient(420px 220px at var(--mx,70%) var(--my,0%),rgba(245,201,107,.10),transparent 60%)}
.mcard:hover{border-color:rgba(245,201,107,.38);transform:translateY(-5px) rotateX(var(--rx,0)) rotateY(var(--ry,0));box-shadow:0 18px 50px rgba(0,0,0,.5),0 0 30px rgba(245,201,107,.07)}
.mcard:hover::before{opacity:1}
.mcard .mc-top{display:flex;align-items:flex-start;gap:11px}
.mcard .mc-top>div:nth-child(2){flex:1;min-width:0}

.tool-badge.gc{background:rgba(79,216,255,.08);color:#9FEAFF;border-color:rgba(79,216,255,.3)}

/* 表格视图（保留，可切换） */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--glass);backdrop-filter:blur(14px);box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;min-width:1080px;font-size:13px}

tbody td{padding:11px 14px;border-bottom:1px solid rgba(255,255,255,.05);vertical-align:middle}
tbody tr{transition:background .18s;cursor:pointer}

.m-name{font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:9px;white-space:nowrap}

.grade{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:8px;font-weight:800;font-size:12.5px;color:#0A0E1A;flex-shrink:0;box-shadow:0 0 12px rgba(255,255,255,.07)}

.mm{display:flex;gap:4px;flex-wrap:wrap}

.mm i.img{color:#B79CFF;border-color:rgba(183,156,255,.35);background:rgba(183,156,255,.08)}
.mm i.aud{color:var(--b);border-color:rgba(52,229,160,.35);background:rgba(52,229,160,.07)}
.mm i.vid{color:#FF8BA0;border-color:rgba(255,139,160,.35);background:rgba(255,139,160,.07)}
.tag{display:inline-block;font-size:11px;padding:2px 9px;border-radius:7px;margin:1px 3px 1px 0;background:rgba(255,255,255,.05);color:#A8B4CC;border:1px solid rgba(255,255,255,.08);white-space:nowrap}
.tag.think{background:rgba(245,201,107,.1);color:var(--gold2);border-color:rgba(245,201,107,.3)}
.tag.have{background:rgba(54,211,153,.14);color:var(--green2);border-color:rgba(54,211,153,.35)}
.tag.new{background:rgba(255,123,66,.14);color:#FF7B42;border-color:rgba(255,123,66,.35);animation:newPulse 2s ease infinite}
@keyframes newPulse{0%,100%{opacity:1}50%{opacity:.65}}
.cost{font-size:12px;white-space:nowrap;font-weight:600}
.cost.low{color:var(--b)} .cost.mid{color:var(--warn)} .cost.high{color:var(--danger)}
.toolcell{display:flex;gap:4px;flex-wrap:wrap}

/* 视图模式切换（卡片/表格） */
.viewmode{display:flex;gap:4px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px;padding:3px;margin-left:auto}
.viewmode .vm-btn{cursor:pointer;padding:5px 12px;border-radius:8px;font-size:12px;color:var(--muted);transition:all .2s;border:none;background:none;font-family:inherit}
.viewmode .vm-btn.on{background:var(--gold-dim);color:var(--gold2);font-weight:700}
.viewmode .theme-toggle{font-size:14px;padding:5px 10px;transition:transform .3s}
.viewmode .theme-toggle:hover{transform:rotate(20deg) scale(1.1);color:var(--gold2)}

/* ===== 空态 ===== */
.empty{text-align:center;padding:80px 20px;color:var(--muted)}
.empty .empty-icon{font-size:48px;margin-bottom:14px;animation:floatY 3s ease-in-out infinite}
.empty b{display:block;font-size:17px;color:var(--ink);margin-bottom:6px}
@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

/* ===== 工具视图 ===== */
.cat-tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.cat-tab{padding:7px 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--muted);cursor:pointer;font-size:12.5px;font-weight:600;transition:all .2s;backdrop-filter:blur(8px)}
.cat-tab:hover{color:var(--ink);border-color:var(--line-strong)}
.cat-tab.on{background:linear-gradient(135deg,rgba(245,201,107,.9),rgba(232,155,60,.88));color:#0A0E1A;font-weight:800;border-color:transparent;box-shadow:0 4px 18px rgba(245,201,107,.3)}
.cat-count{font-size:11.5px;color:var(--dim);margin-left:auto}
.toolgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(350px,1fr));gap:16px;perspective:1200px}
.toolcard{background:var(--glass);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;transition:all .28s;backdrop-filter:blur(14px);position:relative;overflow:hidden;transform-style:preserve-3d}
.toolcard::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .3s;
  background:radial-gradient(420px 200px at 90% 0%,rgba(245,201,107,.09),transparent 60%)}
.toolcard:hover{border-color:rgba(245,201,107,.35);transform:translateY(-5px) rotateX(var(--rx,0)) rotateY(var(--ry,0));box-shadow:0 16px 50px rgba(0,0,0,.5),0 0 26px rgba(245,201,107,.06)}
.toolcard:hover::before{opacity:1}
/* ===== 工具卡顶部 + 雷达图 ===== */
.toolcard .tc-top{display:flex;align-items:flex-start;gap:10px;margin-bottom:11px}
.toolcard .tc-top>div:nth-child(2){flex:1;min-width:0}
.tc-logo{flex-shrink:0}
/* 厂商官方 logo + 字母兜底块 */
.brand-logo{display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;vertical-align:middle}
.logo-fallback{display:inline-flex;align-items:center;justify-content:center;border-radius:26%;color:#fff;font-weight:800;font-size:.55em;flex-shrink:0;vertical-align:middle;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.mc-logo{flex-shrink:0;display:flex;align-items:center}
.mc-logo .logo-fallback{font-size:17px}
.lc-logo{flex-shrink:0;display:flex;align-items:center}
.lc-logo .logo-fallback{font-size:15px}
/* 等级小胶囊（模型名旁） */
.grade-pill{display:inline-flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:800;padding:1px 7px;border-radius:999px;margin-left:7px;vertical-align:1px;letter-spacing:.3px}
.grade-pill.new{animation:newPulse 2s ease infinite}
.toolcard .tc-radar{flex-shrink:0;margin-left:auto;opacity:.9;transition:all .3s;animation:radarIn .8s cubic-bezier(.22,1,.36,1) both}
.toolcard:hover .tc-radar{opacity:1;transform:scale(1.06)}
.toolcard h3{font-size:16.5px;font-weight:800;display:flex;align-items:center;gap:9px}
.toolcard .t-sub{color:var(--muted);font-size:12px;margin:3px 0 0}

/* ===== 雷达图大图块（弹窗内）===== */
.radar-block{display:flex;align-items:center;gap:18px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 18px;backdrop-filter:blur(8px);flex:1;flex-wrap:wrap}
.radar-fig{flex-shrink:0}
.radar-fig .radar-svg{display:block;animation:radarIn .7s cubic-bezier(.22,1,.36,1) both}
.radar-labels{display:grid;grid-template-columns:repeat(2,minmax(70px,1fr));gap:5px 16px;flex:1;min-width:160px}
.radar-labels .rl-row{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted)}
.radar-labels .rl-dot{width:7px;height:7px;border-radius:2px;flex-shrink:0}
.radar-labels .rl-row b{margin-left:auto;color:var(--ink);font-variant-numeric:tabular-nums;font-weight:700}
.toolcard .t-desc{font-size:13px;color:#C3CCE0;margin-bottom:11px;line-height:1.7}
.t-eco{font-size:11.5px;color:var(--muted);background:var(--cyan-dim);border:1px solid rgba(79,216,255,.25);border-radius:8px;padding:5px 10px;margin-bottom:10px;line-height:1.6;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.t-eco b{color:var(--cyan);font-weight:700}
.t-eco .eco-hot{color:var(--gold2);background:var(--gold-dim);border-radius:5px;padding:0 6px}
.t-eco .eco-live{font-size:9px;font-weight:800;background:var(--ok);color:#0A0E1A;border-radius:4px;padding:1px 6px;margin-left:auto;letter-spacing:.5px;animation:pulse 1.8s infinite}
.toolcard .t-mode{font-size:12px;color:var(--muted);margin-bottom:8px}
.toolcard .t-mode b{color:var(--gold2);font-weight:600}
.toolcard .t-models{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.toolcard .t-models .tm{font-size:12px;padding:5px 11px;border-radius:9px;background:var(--card2);border:1px solid var(--line);cursor:pointer;transition:all .18s;font-weight:600}
.toolcard .t-models .tm:hover{border-color:var(--gold);color:var(--gold2);transform:translateY(-2px);box-shadow:0 4px 16px rgba(245,201,107,.15)}
.toolcard .t-hl{margin-top:11px;font-size:12px;color:var(--gold2);background:var(--gold-dim);border:1px solid rgba(245,201,107,.25);border-radius:9px;padding:7px 11px;line-height:1.7}
.toolcard .t-src{margin-top:9px;font-size:11px;color:var(--dim)}

/* ===== 实时动态 ===== */
.live-head{display:flex;align-items:center;gap:10px;margin-bottom:18px;padding:16px 20px;background:linear-gradient(135deg,rgba(52,229,160,.08),rgba(79,216,255,.06));border:1px solid rgba(52,229,160,.3);border-radius:var(--r-lg);flex-wrap:wrap;backdrop-filter:blur(12px)}
.live-dot{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 14px rgba(52,229,160,.9);animation:pulse 1.6s infinite}
.live-head b{font-size:16px}
.live-src{font-size:12px;color:var(--muted);margin-left:auto;font-variant-numeric:tabular-nums}
.live-sec{margin-bottom:28px}
.live-sec h3{font-size:15px;font-weight:800;margin-bottom:13px;display:flex;align-items:center;gap:8px}
.live-count{font-size:11px;background:var(--card2);border:1px solid var(--line);border-radius:20px;padding:1px 9px;color:var(--muted);font-weight:600}
.live-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.live-card{background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:14px 15px;cursor:pointer;transition:all .22s;backdrop-filter:blur(10px);animation:riseIn .5s ease both}
.live-card:hover{border-color:var(--cyan);transform:translateY(-4px);box-shadow:0 10px 30px rgba(79,216,255,.1)}
.lc-body{display:flex;align-items:center;gap:12px}
.lc-info{flex:1;min-width:0}
.lc-radar{flex-shrink:0;opacity:.92;transition:all .3s;animation:radarIn .8s cubic-bezier(.22,1,.36,1) both}
.live-card:hover .lc-radar{opacity:1;transform:scale(1.06)}
.live-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.live-name{font-size:13.5px;font-weight:700}
.new-tag{font-size:10px;font-weight:800;background:rgba(245,201,107,.18);color:var(--gold2);border:1px solid rgba(245,201,107,.45);border-radius:6px;padding:1px 6px;letter-spacing:.5px;animation:blink 2.4s infinite}
.have-tag{font-size:10px;font-weight:800;background:rgba(52,229,160,.15);color:var(--ok);border:1px solid rgba(52,229,160,.4);border-radius:6px;padding:1px 6px}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.55}}
.live-id{font-size:11px;color:var(--dim);font-family:ui-monospace,Consolas,monospace;margin:3px 0 8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.live-meta{display:flex;gap:12px;font-size:11.5px;color:var(--muted);flex-wrap:wrap}
.live-meta b{color:var(--ink);font-weight:700}
.live-mm{font-size:11px;color:#9FB4D8;margin-top:6px;min-height:16px}
.live-sub{font-size:11px;color:var(--dim);margin-top:5px}
.live-note{margin-top:6px;font-size:12px;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:11px 14px;line-height:1.8}

/* ===== 弹窗（升级）===== */
.modal-mask{position:fixed;inset:0;background:rgba(4,6,12,.72);z-index:100;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(14px)}
.modal-mask.show{display:flex;animation:maskIn .3s ease both}
@keyframes maskIn{from{opacity:0}to{opacity:1}}
.modal{position:relative;background:linear-gradient(165deg,rgba(19,27,48,.97),rgba(10,15,30,.97));border:1px solid rgba(245,201,107,.22);border-radius:24px;max-width:680px;width:100%;max-height:88vh;overflow-y:auto;padding:30px;box-shadow:0 30px 90px rgba(0,0,0,.65),0 0 50px rgba(245,201,107,.06);animation:modalIn .4s cubic-bezier(.22,1.2,.36,1)}
@keyframes modalIn{from{transform:scale(.9) translateY(24px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
.modal h2{font-size:22px;font-weight:800;display:flex;align-items:center;gap:12px;margin-bottom:6px}
.modal .m-sub{color:var(--muted);font-size:13px;margin-bottom:20px}
.m-sec{margin:16px 0}
.m-sec h4{font-size:11.5px;color:var(--gold);margin-bottom:8px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;display:flex;align-items:center;gap:7px}
.m-sec .m-row{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.m-sec p{font-size:13.5px;color:#C3CCE0;line-height:1.8}
.m-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:16px 0}
.m-item{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:12px 14px;backdrop-filter:blur(8px);transition:all .25s}
.m-item:hover{border-color:var(--line-strong);transform:translateY(-2px)}
.m-item .k{font-size:11px;color:var(--muted)}
.m-item .v{font-size:15px;font-weight:700;margin-top:3px}
.modal .close{position:absolute;top:16px;right:16px;width:36px;height:36px;border-radius:11px;background:var(--card2);border:1px solid var(--line);color:var(--muted);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;z-index:2}
.modal .close:hover{color:#fff;border-color:var(--danger);background:rgba(255,84,112,.14);transform:rotate(90deg)}

/* ===== Footer ===== */
footer{max-width:1280px;margin:0 auto 50px;padding:0 24px;color:var(--dim);font-size:12px}
footer .src{background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:16px 20px;margin-top:12px;backdrop-filter:blur(12px)}
footer .src h5{color:var(--muted);font-size:12px;margin-bottom:6px;letter-spacing:.5px}
footer .src p{margin:3px 0;line-height:1.8}

/* ===== 通用动画 ===== */
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(52,229,160,.5)}50%{opacity:.7;box-shadow:0 0 0 6px rgba(52,229,160,0)}}
@keyframes riseIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
.rise{animation:riseIn .5s ease both}
.scroll-reveal{opacity:0;transform:translateY(26px);transition:opacity .7s cubic-bezier(.22,1,.36,1),transform .7s cubic-bezier(.22,1,.36,1)}
.scroll-reveal.in{opacity:1;transform:translateY(0)}

/* ===== 移动端 ===== */
@media (max-width:900px){
  .hero{padding:40px 16px 20px}
  .stats{padding:0 16px;grid-template-columns:repeat(2,1fr)}
  .toolbar{top:8px;margin:14px 12px 0;padding:10px 12px}
  main{padding:0 16px}
  .cards-wrap{grid-template-columns:1fr}
  .toolgrid{grid-template-columns:1fr}
  .viewmode{margin-left:0;width:100%}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
  .scroll-reveal{opacity:1;transform:none}
  .mcard,.toolcard{transform:none!important}
}

<script>
'use strict';
/* ============================================================
   大模型多维对比总览 v3
   渲染层：卡片网格（默认）/ 表格 双模式
   动效层（ui-motion）：卡片3D tilt + 光标聚光 + 上下文条展开 + scroll-reveal
   交互层（ui-interaction）：推荐横幅 / 筛选状态 / 弹窗生命周期
   ============================================================ */
const DATA = JSON.parse(document.getElementById('app-data').textContent);
const MODELS = DATA.models;
const TOOLS = DATA.tools;
const META = DATA.meta;
const toolById = {}; TOOLS.forEach(t => toolById[t.id] = t);
const toolBadgeClass = {
  'workbuddy':'wb','qoder':'qd','trae':'tr','cursor':'cs','claude-code':'cc',
  'gemini-cli':'gc','codex':'cx','copilot':'cp','windsurf':'ws'
};

/* ===== 状态 ===== */
const state = {
  view: 'models', mode: 'cards',
  q: '', grade: '', vendor: '', mm: '', sort: 'grade',
  includeNew: true,
  modalId: null
};

/* ===== 实时汇率（fetchFx：open.er-api.com 免费无 key）===== */
let FX = META.exchangeRate || 7.2;         // 当前汇率（初始用 meta 固定值兜底）
let FX_SOURCE = 'meta:' + FX;              // 汇率来源描述
let FX_TIME = null;                        // 汇率更新时间戳
const FX_API = 'https://open.er-api.com/v6/latest/USD';

async function fetchFx(){
  try{
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 8000);
    const res = await fetch(FX_API, {signal: ctrl.signal});
    clearTimeout(timer);
    const d = await res.json();
    const cny = d && d.rates && d.rates.CNY;
    if(cny && cny > 1 && cny < 30){       // 合理区间校验
      FX = parseFloat(cny);
      FX_SOURCE = 'open.er-api.com';
      FX_TIME = d.time_last_update_unix ? d.time_last_update_unix*1000 : Date.now();
    }
  }catch(e){ /* 网络失败：保持 meta 兜底汇率 */ }
  renderFxBadge();
  if(LIVE_LOADED && state.view === 'live') renderLive();   // 汇率更新后重渲染价格
}
function renderFxBadge(){
  const el = document.getElementById('fxBadge');
  if(!el) return;
  const src = FX_SOURCE.startsWith('meta') ? '固定值' : '实时API';
  const t = FX_TIME ? new Date(FX_TIME).toLocaleTimeString('zh-CN',{hour12:false}) : '';

function radarSvg(vals, color, size){
  const cx=50, cy=50, R=40;
  const N=6;
  const ang = i => -Math.PI/2 + i*2*Math.PI/N;
  const pt = (i, r) => [cx + Math.cos(ang(i))*r, cy + Math.sin(ang(i))*r].map(x=>x.toFixed(2)).join(',');
  let grid='';
  for(let l=1;l<=4;l++){
    const rr=R*l/4;
    const pts=[]; for(let i=0;i<N;i++) pts.push(pt(i,rr));
    grid+=`<polygon points="${pts.join(' ')}" fill="none" stroke="rgba(255,255,255,.09)" stroke-width="1"/>`;
  }
  let axes='';
  for(let i=0;i<N;i++){ const [x,y]=pt(i,R).split(','); axes+=`<line x1="50" y1="50" x2="${x}" y2="${y}" stroke="rgba(255,255,255,.12)" stroke-width="1"/>`; }
  const dp=[]; const dp2=[];
  for(let i=0;i<N;i++){
    const r=R*Math.max(.04,Math.min(1,(vals[i]||0)/100));
    dp.push(pt(i,r)); dp2.push(pt(i,r).split(','));
  }
  const data=`<polygon points="${dp.join(' ')}" fill="${color}2e" stroke="${color}" stroke-width="2.2" stroke-linejoin="round"/>`;
  let dots='';
  for(let i=0;i<N;i++){ const [x,y]=dp2[i]; dots+=`<circle cx="${x}" cy="${y}" r="2.4" fill="${color}"/>`; }
  return `<svg viewBox="0 0 100 100" class="radar-svg" style="width:${size}px;height:${size}px">${grid}${axes}${data}${dots}</svg>`;
}
function radarBlock(rd, color, size){
  const rows = rd.labels.map((l,i)=>`<span class="rl-row"><span class="rl-dot" style="background:${color}"></span>${l}<b>${rd.vals[i]}</b></span>`).join('');
  return `<div class="radar-block"><div class="radar-fig">${radarSvg(rd.vals, color, size)}</div><div class="radar-labels">${rows}</div></div>`;
}

  { re:/快|速度|秒回|实时|低延迟|急用/, label:"响应快" },
  { re:/新手|小白|入门|简单|易用|不懂/, label:"新手友好", costLow:true }
];

function inferTask(q){
  const lower = q.toLowerCase();
  const hits = SIGNALS.filter(s => s.re.test(lower));
  if(!hits.length) return null;
  const scenes = [...new Set(hits.flatMap(h => h.scenes || []))];
  const strengths = [...new Set(hits.flatMap(h => h.strengths || []))];
  const labels = hits.map(h => h.label);
  // 信号命中长度（与词典 PK 用：谁命中的词更长谁更具体）
  let bestLen = 0;
  for(const h of hits){
    const src = h.re.source.split('|');
    for(const w of src){ if(w.length > bestLen && lower.includes(w.toLowerCase())) bestLen = w.length; }
  }
  return {
    label: labels.slice(0, 2).join(' + '),
    scenes, strengths,
    flags: {
      needMM: hits.some(h => h.needMM),
      needBigCtx: hits.some(h => h.needBigCtx),
      costLow: hits.some(h => h.costLow),
      gradeHigh: hits.some(h => h.gradeHigh)
    },
    detected: labels,
    sigLen: bestLen,
    inferred: true,
    reason: '识别到需求：' + labels.join('、')
  };
}
/* 任意查询的任务解析：词典 vs 信号推断，命中更长者为主（更具体），另一个合并补充 */
function resolveTask(q){
  const t = matchTask(q);
  const inf = inferTask(q);
  if(!t) return inf;
  if(!inf) return t;
  const tLen = t.kw.reduce((a, k) => q.toLowerCase().includes(k) ? Math.max(a, k.length) : a, 0);
  const primary = (inf.sigLen || 0) > tLen ? inf : t;   // 更长命中 = 更具体 = 主任务
  const secondary = primary === inf ? t : inf;
  return Object.assign({}, primary, {
    scenes: [...new Set([...(primary.scenes||[]), ...(secondary.scenes||[])])],
    strengths: [...new Set([...(primary.strengths||[]), ...(secondary.strengths||[])])],
    top: primary.top || secondary.top,
    flags: Object.assign({}, secondary.flags, primary.flags),
    reason: primary.reason + '（兼顾' + secondary.label + '）'
  });
}
/* 按名称/厂商精确查找（用户明确搜某模型时） */
function findByName(q){
  const lower = q.toLowerCase();
  return allModels().filter(m => {
    const hay = [m.name, m.vendor, m.vendorCn, m.id].join(' ').toLowerCase();
    return hay.includes(lower);
  });
}
function scoreModel(m, task){
  let s = 0;
  (task.scenes||[]).forEach(sc => { if((m.scenes||[]).includes(sc)) s += 3; });
  (task.strengths||[]).forEach(st => { if((m.strengths||[]).includes(st)) s += 2; });
  if(task.top && task.top.includes(m.id)) s += 6;
  const f = task.flags || {};
  s += (META.gradeScore[m.grade]||0) * (f.gradeHigh ? 2 : 1);
  if(m.cost === '低') s += f.costLow ? 4 : 1;
  if(f.needMM && (m.multimodal.length > 1)) s += 5;
  if(f.needBigCtx && m.contextVal >= 256) s += 4;
  if(m.grade === 'NEW') s -= 2;   // 未评级稍降权
  return s;
}

/* ===== 过滤 ===== */
function filteredModels(){
  let list = allModels().slice();
  if(state.grade) list = list.filter(m => m.grade === state.grade);
  if(state.vendor) list = list.filter(m => m.vendor === state.vendor);
  if(state.mm){
    if(state.mm === '多模态') list = list.filter(m => m.multimodal.length > 1 || m.multimodal.includes('图像') || m.multimodal.includes('音频') || m.multimodal.includes('视频'));
    else if(state.mm === '思考模式') list = list.filter(m => m.thinking);
    else if(state.mm === '1M上下文') list = list.filter(m => m.contextVal >= 1000);
  }
  if(state.q){
    const q = state.q.toLowerCase();
    // 1. 明确搜某个模型/厂商名 → 精确命中优先
    const named = findByName(state.q);
    const task = resolveTask(state.q);
    if(named.length && !task){
      list = named;
    } else if(task){
      // 2. 任务/需求识别 → 按匹配度推荐（含 named 命中的加权）
      list = list.map(m => ({m, s: scoreModel(m, task) + (named.includes(m) ? 10 : 0)}))
        .sort((a,b) => b.s - a.s).slice(0, 8).map(x => x.m);
    } else {
      // 3. 普通全文搜索
      const txt = list.filter(m => {
        const hay = [m.name, m.vendor, m.vendorCn, m.bestFor, m.strengths.join(' '), m.scenes.join(' '), m.notes, fmtCtx(m.contextVal), m.context].join(' ').toLowerCase();
        return hay.includes(q);
      });
      if(txt.length){
        list = txt;
      } else {
        // 4. 都没命中 → 通用推荐兜底（综合等级 Top8，永不空手而归）
        list = list.map(m => ({m, s: (META.gradeScore[m.grade]||0) + (m.grade==='NEW'?2.5:0)}))
          .sort((a,b) => b.s - a.s).slice(0, 8).map(x => x.m);
      }
    }
  } else if(state.sort === 'context') list.sort((a,b) => b.contextVal - a.contextVal);
  else if(state.sort === 'name') list.sort((a,b) => a.name.localeCompare(b.name, 'zh'));
  else list.sort((a,b) => (b.grade==='NEW'?99:(META.gradeScore[b.grade]||0)) - (a.grade==='NEW'?99:(META.gradeScore[a.grade]||0)));
  return list;
}

/* ===== 推荐横幅 ===== */
function recoBanner(){
  if(!state.q) return '';
  const task = resolveTask(state.q);
  const named = findByName(state.q);
  // 通用兜底横幅（搜什么都推荐，永不空手）
  if(!task && !named.length){
    const scored = allModels().map(m => ({m, s: (META.gradeScore[m.grade]||0) + (m.grade==='NEW'?2.5:0)}))
      .sort((a,b) => b.s - a.s).slice(0, 3);
    const chips = scored.map((x, i) => `<span class="reco-chip" style="animation-delay:${i*90}ms" onclick="openModal('${x.m.id}')">
      ${vendorLogo(x.m.vendorCn || x.m.vendor, 26)}<span class="grade-pill${x.m.grade==='NEW'?' new':''}" style="background:${gradeColor(x.m.grade)}22;color:${gradeColor(x.m.grade)};border:1px solid ${gradeColor(x.m.grade)}55">${x.m.grade}</span>
      <b>${esc(x.m.name)}</b><i>${esc((x.m.bestFor||'').split('——')[0])}</i></span>`).join('');
    return `<div class="reco">
      <div class="reco-head">💡 <b>综合推荐</b><span class="reco-reason">描述你的需求（如「做公众号」「翻译合同」「便宜好用」），我会为你匹配模型</span></div>
      <div class="reco-chips">${chips}</div>
    </div>`;
  }
  if(!task) return '';  // 只命中模型名，无需推荐横幅
  const scored = allModels().map(m => ({m, s: scoreModel(m, task) + (named.includes(m) ? 10 : 0)}))
    .sort((a,b) => b.s - a.s).slice(0, 3);
  const chips = scored.map((x, i) => {
    const m = x.m;
    return `<span class="reco-chip" style="animation-delay:${i*90}ms" onclick="openModal('${m.id}')">
      ${vendorLogo(m.vendorCn || m.vendor, 26)}<span class="grade-pill${m.grade==='NEW'?' new':''}" style="background:${gradeColor(m.grade)}22;color:${gradeColor(m.grade)};border:1px solid ${gradeColor(m.grade)}55">${m.grade}</span>
      <b>${esc(m.name)}</b>
      <i>${esc((m.bestFor||'').split('——')[0])}</i>
    </span>`;
  }).join('');
  return `<div class="reco">
    <div class="reco-head">🎯 <b>${esc(task.label)}</b><span class="reco-reason">${esc(task.reason)}</span></div>
    <div class="reco-chips">${chips}</div>
  </div>`;
}

/* ===== 工具生态动态（从 OpenRouter LIVE 实时统计）===== */
function toolEcoStats(t){
  if(!LIVE || !LIVE.length) return null;
  const vs = (t.liveVendors || []).map(v => v.toLowerCase());
  if(!vs.length) return null;
  const eco = LIVE.filter(m => {
    const v = (m.id.split('/')[0] || '').toLowerCase();
    return vs.some(x => v === x || v.includes(x) || x.includes(v));
  });
  const now = Date.now() / 1000;
  const weekAgo = now - 7*24*3600;
  const recent = eco.filter(m => m.created > weekAgo);
  const newest = eco.filter(m => m.created > 0).sort((a,b) => b.created - a.created)[0];
  return {
    count: eco.length,
    recent7: recent.length,
    newestName: newest ? (newest.name || newest.id) : null,
    newestDays: newest ? Math.max(0, Math.round((now - newest.created)/86400)) : null
  };
}
function toolEcoHTML(t){
  const s = toolEcoStats(t);
  if(!s) return '';
  const live = LIVE_LOADED ? `<span class="eco-live">LIVE</span>` : '';
  const recent = s.recent7 > 0 ? `<b class="eco-hot">+${s.recent7}</b> 7天` : `<b>0</b> 7天`;
  const newest = s.newestName ? `最新 <b>${esc(s.newestName)}</b>` : '';
  return `<div class="t-eco">📡 ${s.count}${newest?` · ${newest}`:''}${recent?` · ${recent}`:''}${live}</div>`;
}

function localSlugSet(){
  const s = new Set();
  MODELS.forEach(m => { s.add(m.id.toLowerCase()); if(m.orId) s.add(m.orId.split('/').pop().toLowerCase()); });
  return s;
}
/* 系列家族键：从 slug 提取「字母前缀+版本号」，如 gpt-5.6-luna → gpt5.6 */
function famKey(slug){
  const s = slug.toLowerCase();
  const m = s.match(/([a-z]+-?)?(\d+(?:\.\d+)?)/);
  const k = m ? (m[1]||'') + m[2] : s;
  return k.replace(/-/g,'');
}
/* 本地档案已覆盖的家族集合 */
function localFamSet(){
  const s = new Set();
  MODELS.forEach(m => {
    s.add((m.id.split('/')[0]||'').toLowerCase() + '|' + famKey(m.id.split('/').pop()));
    if(m.orId) s.add((m.orId.split('/')[0]||'').toLowerCase() + '|' + famKey(m.orId.split('/').pop()));
  });
  // 本地 id 无 vendor 前缀，补充「厂商→vendor前缀」的家族键
  const VENDOR2OR = {'OpenAI':'openai','Anthropic':'anthropic','Google':'google','深度求索':'deepseek','阿里':'qwen','月之暗面':'moonshotai','智谱 AI':'z-ai','MiniMax':'minimax','字节跳动':'bytedance-seed','腾讯':'tencent','百度':'baidu'};
  MODELS.forEach(m => {
    const ov = VENDOR2OR[m.vendor];
    if(ov) s.add(ov + '|' + famKey(m.id));
  });
  return s;
}
/* 从 LIVE 构建自动收录的新模型（每个系列家族取最新，近120天，主流厂商） */
function buildAutoNew(){
  AUTONEW = [];
  if(!LIVE || !LIVE.length) return;
  const local = localSlugSet();
  const localFam = localFamSet();
  const now = Date.now()/1000;
  const cutoff = now - 120*24*3600;                 // 近 120 天上线
  // 候选：主流厂商 + 近期上线 + 有上下文 + 非本地已收录/同家族
  const cand = LIVE.filter(m => {
    const vendor = (m.id.split('/')[0]||'').toLowerCase();
    if(!OR_VENDOR[vendor]) return false;
    if(!(m.created > cutoff)) return false;
    if(!(m.context_length >= 32000)) return false;   // 排除小上下文专用模型
    const slug = (m.id.split('/').pop()||'').toLowerCase();
    if(local.has(slug)) return false;
    if(local.has(m.id.toLowerCase())) return false;
    if(localFam.has(vendor + '|' + famKey(slug))) return false;
    return true;
  });
  // 按上线时间降序，家族去重（同厂商同系列只留最新一个）
  cand.sort((a,b) => b.created - a.created);
  const seenFam = new Set();
  const picked = [];
  for(const m of cand){
    const vendor = (m.id.split('/')[0]||'').toLowerCase();
    const fam = vendor + '|' + famKey(m.id.split('/').pop());
    if(seenFam.has(fam)) continue;
    seenFam.add(fam);
    picked.push(m);
    if(picked.length >= 14) break;                   // 最多收录 14 个
  }
  AUTONEW = picked.map(or => orToLocal(or));
  // 注册 hover 提示
  AUTONEW.forEach(m => { TIP_DB['model:'+m.id] = autoTipFn(m); });
}
/* OpenRouter 模型 → 本地模型结构 */
function orToLocal(or){
  const vendorKey = (or.id.split('/')[0]||'').toLowerCase();
  const [vendor, country] = OR_VENDOR[vendorKey] || [vendorKey, '—'];
  const ctxK = Math.round((or.context_length||0)/1000);
  const mods = or.architecture?.input_modalities || [];
  const multimodal = ['文本'];
  if(mods.includes('image')) multimodal.push('图像');
  if(mods.includes('audio')) multimodal.push('音频');
  if(mods.includes('video')) multimodal.push('视频');
  const thinking = !!(or.reasoning && (or.reasoning.supported_efforts?.length || or.reasoning.mandatory || or.reasoning.default_enabled));
  const pIn = parseFloat(or.pricing?.prompt);
  const perM = isNaN(pIn) ? 3 : pIn*1e6;
  const cost = perM < 0.5 ? '低' : perM < 3 ? '中' : '高';
  const slug = or.id.split('/').pop();
  return {
    id: 'auto:' + or.id, orId: or.id, name: or.name || slug,
    vendor, vendorCn: VENDOR_CN[vendor] || vendor, country,
    grade: 'NEW', context: fmtCtx(ctxK), contextVal: ctxK,
    multimodal, thinking, cost,
    scenes: ['新上架'], strengths: [thinking?'推理':'文本', ...(mods.includes('image')?['图像']:[])],
    bestFor: 'OpenRouter 新收录旗舰（自动同步，待实测评级）',
    notes: '由 OpenRouter 实时数据自动收录，尚未人工评级。价格/上下文为官方实时值。',
    tools: [], isAuto: true, created: or.created || 0,
    liveRef: or
  };
}
function autoTipFn(m){
  return () => `<div class="tip-title"><span class="tip-dot" style="background:#FF7B42"></span>${esc(m.name)} · NEW · ${m.cost}费用</div>
    <div class="tip-models">🆕 OpenRouter 自动收录 · ${fmtCtx(m.contextVal)} 上下文${m.thinking?' · 🧠推理':''}</div>
    <div class="tip-notes">待人工评级 · 点击查看详情</div>`;
}
/* 全部模型（本地档案 + 自动收录） */
function allModels(){ return state.includeNew ? MODELS.concat(AUTONEW) : MODELS; }

function isLocalModel(orId){
  const slug = (orId.split('/').pop() || '').toLowerCase();
  const inAuto = AUTONEW.some(m => m.orId === orId);
  if(inAuto) return true;
  return MODELS.some(m => {
    const mid = m.id.toLowerCase();
    return slug === mid || slug.startsWith(mid) || slug.includes(mid);
  });
}
function fmtPricePerM(p){
  const n = parseFloat(p);
  if(isNaN(n) || n < 0) return '—';
  const perM = n * 1e6 * FX;  // 美元 → 人民币（FX 实时汇率，见 fetchFx）
  if(perM === 0) return '¥0';
  if(perM < 0.01) return '¥'+perM.toFixed(3);
  if(perM < 1) return '¥'+perM.toFixed(2);
  if(perM < 100) return '¥'+perM.toFixed(1);
  return '¥'+Math.round(perM);
}
function liveModality(mods){
  const m = mods || [];
  if(!m.length) return '';
  const icons = m.map(x => x==='text'?'文本':(x==='image'?'🖼️':(x==='audio'?'🎵':(x==='video'?'🎬':x))));
  return icons.slice(0,4).join(' ');
}
function liveVendor(id){ return id.split('/')[0] || '?'; }

/* ===== 实时模型六维雷达（OpenRouter 硬指标推导）===== */
function liveRadarData(m){
  const ctx = Math.min(100, (m.context_length||0)/10000);          // 1M=100, 524K=52, 262K=26
  const pIn = parseFloat(m.pricing?.prompt);                       // 输入价性价比（越低越高分）
  const inScore = isNaN(pIn) ? 50 : Math.round(100 * (0.5 / (pIn*1e6 + 0.5)));
  const pOut = parseFloat(m.pricing?.completion);
  const outScore = isNaN(pOut) ? 50 : Math.round(100 * (1.5 / (pOut*1e6 + 1.5)));
  const mods = m.architecture?.input_modalities || [];
  let mm = 20;
  if(mods.includes('image')) mm += 35;
  if(mods.includes('audio')) mm += 25;
  if(mods.includes('video')) mm += 20;
  if(mods.includes('file')) mm += 10;
  mm = Math.min(100, mm);
  const r = m.reasoning || {};
  const reason = r.mandatory ? 100 : (r.supported_efforts && r.supported_efforts.length ? 85 : (r.default_enabled ? 80 : 40));
  const created = m.created || 0;
  const fresh = created > 0 ? Math.round(Math.max(0, Math.min(100, (created - 1735689600) / 40000000 * 100))) : 50;  // 2025-01 起线性
  return {labels:['上下文','输入价','输出价','多模态','推理','新颖度'], vals:[ctx, inScore, outScore, mm, reason, fresh]};
}

async function fetchLive(){
  try{
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 8000);
    const res = await fetch(OR_API, {signal: ctrl.signal});
    clearTimeout(timer);
    const d = await res.json();
    const raw = d.data || [];
    const SKIP_ID = /router|fusion|body builder|:batch|:extended|:nightly|:free|:custom|preview-customtools/i;
    LIVE = raw.filter(m =>
      m.id && !SKIP_ID.test(m.id) && !m.id.startsWith('~') &&
      (m.context_length || 0) > 0 &&
      parseFloat(m.pricing?.prompt ?? '') >= 0
    );
    LIVE_LOADED = true;
    // 缓存到 localStorage（断网/API 挂掉时可兜底）
    try{ localStorage.setItem('llm-live-cache', JSON.stringify({ts: Date.now(), n: LIVE.length, models: LIVE.slice(0, 200)})); }catch(e){}
  }catch(e){
    // 失败时尝试用缓存兜底
    try{
      const c = JSON.parse(localStorage.getItem('llm-live-cache') || 'null');
      if(c && c.models && c.models.length){ LIVE = c.models; LIVE_LOADED = true; LIVE_CACHED = true; }
    }catch(e2){}
    if(!LIVE_LOADED){ LIVE_LOADED = false; LIVE = []; }
  }
  buildAutoNew();          // 自动收录新旗舰进主视图
  renderLive();
  renderStats();           // 统计数字含新收录
  buildFilters();          // 筛选器加 NEW 等级
  syncNewBtn();            // 新增开关按钮
  updateHeroStamp();       // hero 时间戳
  // 汇率/实时价格到位后，模型视图的卡片费用也刷新；工具视图生态统计也刷新
  if(state.view === 'models') renderModels();
  if(state.view === 'tools') renderTools();
}

function buildFilters(){
  const grades = Object.keys(META.gradeDef).concat(AUTONEW.length ? ['NEW'] : []);
  document.getElementById('gradeFilter').innerHTML =
    `<span>等级</span>` +
    grades.map(g => {

      return `<button class="fbtn ${state.grade===g?'on':''}" data-k="grade" data-v="${g}">${g} ${lbl}</button>`;

  const vendors = [...new Set(allModels().map(m => m.vendor))].sort();
  document.getElementById('vendorFilter').innerHTML =
    `<span>厂商</span>` +
    vendors.map(v => `<button class="fbtn vendor-${v} ${state.vendor===v?'on':''}" data-k="vendor" data-v="${v}">${v}</button>`).join('');
  const mms = ['多模态','思考模式','1M上下文'];
  document.getElementById('mmFilter').innerHTML =
    `<span>能力</span>` +
    mms.map(m => `<button class="fbtn ${state.mm===m?'on':''}" data-k="mm" data-v="${m}">${m}</button>`).join('');
  document.querySelectorAll('.fgroup button.fbtn').forEach(b => {
    b.addEventListener('click', e => {
      // ripple 反馈（ui-interaction：点击有位置反馈）
      const rect = b.getBoundingClientRect();
      b.style.setProperty('--rx', (e.clientX-rect.left)+'px');
      b.style.setProperty('--ry', (e.clientY-rect.top)+'px');
      toggleFilter(b.dataset.k, b.dataset.v);
    });
  });
}
function toggleFilter(k, v){
  state[k] = (state[k] === v) ? '' : v;
  syncFilterUI(); renderModels();
}
function syncFilterUI(){
  document.querySelectorAll('.fgroup button.fbtn').forEach(b => {
    b.classList.toggle('on', b.dataset.v === state[b.dataset.k]);
  });
}

/* ===== 统计图表（v3.1：环形图/堆叠条）===== */
function renderStats(){
  const list = allModels();
  const gs = Object.keys(META.gradeDef).concat(AUTONEW.length ? ['NEW'] : []);
  const total = list.length;
  // 数据
  const gradeCount = {};
  gs.forEach(g => gradeCount[g] = list.filter(m=>m.grade===g).length);
  const thinkN = list.filter(m=>m.thinking).length;
  const mmN = list.filter(m => m.multimodal.length>1 || m.multimodal.includes('图像') || m.multimodal.includes('音频') || m.multimodal.includes('视频')).length;
  const oneMN = list.filter(m=>m.contextVal>=1000).length;
  // 上下文分段
  const ctx256 = list.filter(m=>m.contextVal>=256 && m.contextVal<1000).length;
  const ctx128 = list.filter(m=>m.contextVal<256).length;
  // 环形图 arc 生成（SVG stroke-dasharray 动画 + data-tip 悬浮）
  function donut(segs, centerNum, centerLbl){
    const R = 42, C = 2*Math.PI*R;
    let acc = 0;
    const arcs = segs.map(s => {
      const len = C * s.v / total;
      const el = `<circle cx="50" cy="50" r="${R}" fill="none" stroke="${s.c}" stroke-width="13"
        stroke-dasharray="0 500" style="--len:${len.toFixed(2)} 500" class="donut-arc"
        data-tip="${esc(s.tipTitle)}" data-models="${esc(s.tipModels.join(','))}"
        transform="rotate(${acc.toFixed(1)} 50 50)"/>`;
      acc += len;
      return el;
    }).join('');
    const legend = segs.map(s => `<div class="dl-row"><span class="dl-dot" style="background:${s.c}"></span>${s.l}<b>${s.v}</b><span class="dl-pct">${Math.round(s.v/total*100)}%</span></div>`).join('');
    return `<div class="donut-wrap">
      <div class="donut-box"><svg viewBox="0 0 100 100">${arcs}</svg>
        <div class="donut-center"><span class="dc-num">${centerNum}</span><span class="dc-lbl">${centerLbl}</span></div>
      </div>
      <div class="donut-legend">${legend}</div>
    </div>`;
  }
  const gradeSegs = gs.map(g => ({
    v: gradeCount[g], c: g==='NEW' ? '#FF7B42' : META.gradeDef[g].color, l: g+'级',
    tipTitle: g==='NEW' ? '新收录模型' : g+' 级模型', tipModels: list.filter(m=>m.grade===g).map(m=>m.name)
  })).filter(s => s.v > 0);
  const thinkModels = list.filter(m=>m.thinking).map(m=>m.name);
  const mmModels = list.filter(m => !m.thinking && (m.multimodal.length>1 || m.multimodal.includes('图像') || m.multimodal.includes('音频') || m.multimodal.includes('视频'))).map(m=>m.name);
  const textModels = list.filter(m => !m.thinking && !(m.multimodal.length>1 || m.multimodal.includes('图像') || m.multimodal.includes('音频') || m.multimodal.includes('视频'))).map(m=>m.name);
  const capSegs = [
    {v: thinkN, c: 'var(--gold)', l: '思考模式', tipTitle: '思考模式模型', tipModels: thinkModels},
    {v: mmModels.length, c: 'var(--violet)', l: '多模态', tipTitle: '多模态模型（无思考）', tipModels: mmModels},
    {v: textModels.length, c: 'rgba(255,255,255,.14)', l: '纯文本', tipTitle: '纯文本模型', tipModels: textModels}
  ].filter(s => s.v > 0);
  const ctxSegs = [
    {v: oneMN, c: 'var(--gold)', l: '1M+', tipTitle: '1M+ 上下文模型', tipModels: list.filter(m=>m.contextVal>=1000).map(m=>m.name)},
    {v: ctx256, c: 'var(--cyan)', l: '256K~999K', tipTitle: '256K~999K 模型', tipModels: list.filter(m=>m.contextVal>=256 && m.contextVal<1000).map(m=>m.name)},
    {v: ctx128, c: 'rgba(255,255,255,.22)', l: '<256K', tipTitle: '<256K 上下文模型', tipModels: list.filter(m=>m.contextVal<256).map(m=>m.name)}
  ].filter(s => s.v > 0);
  const ctxBars = ctxSegs.map(s => `<div class="bs-seg" style="background:${s.c};flex-basis:${s.v/total*100}%"
    data-tip="${esc(s.tipTitle)}" data-models="${esc(s.tipModels.join(','))}"></div>`).join('');
  const ctxRows = ctxSegs.map(s => `<div class="bs-row"><span class="bs-dot" style="background:${s.c}"></span>${s.l}<b>${s.v}</b><span class="bs-pct">${Math.round(s.v/total*100)}%</span></div>`).join('');

  document.getElementById('hdStats').innerHTML = `
    <div class="stat rise">
      <div class="stat-title">模型库</div>
      <div class="stat-hero">
        <div class="hero-num" data-count="${total}">0</div>
        <div class="hero-sub">
          <div class="sub-item">工具 <b data-count2="${TOOLS.length}">0</b> · 1M+ <b style="color:var(--gold)">${oneMN}</b></div>
        </div>
      </div>
    </div>
    <div class="stat rise" style="animation-delay:80ms">
      <div class="stat-title">等级</div>
      ${donut(gradeSegs, total, '模型')}
    </div>
    <div class="stat rise" style="animation-delay:160ms">
      <div class="stat-title">能力</div>
      ${donut(capSegs, thinkN, '思考')}
    </div>
    <div class="stat rise" style="animation-delay:240ms">
      <div class="stat-title">上下文</div>
      <div class="barstack">
        <div class="bs-track">${ctxBars}</div>
        ${ctxRows}
      </div>
    </div>`;
  // count-up 动画（hero 数字 + 工具数）
  const t0 = performance.now(), dur = 1100;
  const step = now => {
    const p = Math.min(1, (now - t0)/dur), ease = 1 - Math.pow(1-p, 3);
    const n1 = document.querySelector('.hero-num[data-count]');
    const n2 = document.querySelector('[data-count2]');
    if(n1) n1.textContent = Math.round(total * ease);
    if(n2) n2.textContent = Math.round(TOOLS.length * ease);
    if(p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

/* ===== 动效系统（ui-motion 方法论）===== */
let reducedMotion = false;
try{ reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){}

/* scroll-reveal：IO 观察，进入视口渐入 */
function initReveal(){
  if(reducedMotion){ document.querySelectorAll('.scroll-reveal').forEach(el => el.classList.add('in')); return; }
  const io = new IntersectionObserver(entries => {
    entries.forEach(en => {
      if(en.isIntersecting){ en.target.classList.add('in'); io.unobserve(en.target); }
    });
  }, {threshold: .08, rootMargin: '0px 0px -40px 0px'});
  document.querySelectorAll('.scroll-reveal').forEach(el => io.observe(el));
}

/* 卡片 3D tilt + 光标聚光：输入(pointer) → lerp 状态 → transform/CSS变量 */
function initCardFX(){
  if(reducedMotion) return;
  const cards = document.querySelectorAll('.mcard, .toolcard');
  cards.forEach(card => {
    if(card.dataset.fx) return;
    card.dataset.fx = '1';
    let target = {x:0, y:0, mx:50, my:0};
    let smooth = {x:0, y:0};
    let raf = null;
    card.addEventListener('mousemove', e => {
      const r = card.getBoundingClientRect();
      const px = (e.clientX - r.left) / r.width;   // 0..1
      const py = (e.clientY - r.top) / r.height;
      target.x = (px - .5) * 8;                     // 最大 ±4°
      target.y = (py - .5) * -8;
      target.mx = px * 100; target.my = py * 100;
      if(!raf){
        raf = requestAnimationFrame(function tick(){
          smooth.x += (target.x - smooth.x) * .14;  // lerp 系数
          smooth.y += (target.y - smooth.y) * .14;
          card.style.setProperty('--rx', smooth.x.toFixed(2)+'deg');
          card.style.setProperty('--ry', smooth.y.toFixed(2)+'deg');
          card.style.setProperty('--mx', target.mx+'%');
          card.style.setProperty('--my', target.my+'%');
          if(Math.abs(target.x - smooth.x) > .02 || Math.abs(target.y - smooth.y) > .02){
            raf = requestAnimationFrame(tick);
          } else { raf = null; }
        });
      }
    });
    card.addEventListener('mouseleave', () => {
      target = {x:0, y:0, mx:50, my:0};
      if(raf){ cancelAnimationFrame(raf); raf = null; }
      card.style.setProperty('--rx','0deg');
      card.style.setProperty('--ry','0deg');
    });
  });
  // 上下文条展开动画
  requestAnimationFrame(() => {
    document.querySelectorAll('.mcard .mc-ctx').forEach((el, i) => {
      setTimeout(() => el.classList.add('ctx-in'), 150 + i*35);
    });
  });
}

/* ===== 图表/卡片悬浮提示（事件委托 + 生命周期）===== */
(function(){
  const tip = document.createElement('div');
  tip.className = 'chart-tip';
  tip.id = 'chartTip';
  document.body.appendChild(tip);
  let hideTimer = null;
  function showTip(html){
    tip.innerHTML = html;
    tip.classList.add('show');
  }
  function hideTip(){ clearTimeout(hideTimer); tip.classList.remove('show'); }
  // 内容生成：data-tip（标题+芯片）或 data-tip-key（模型/工具索引）
  function tipContent(el){
    const key = el.dataset.tipKey;
    if(key){ return TIP_DB[key] ? TIP_DB[key]() : null; }
    const models = (el.dataset.models || '').split(',').filter(Boolean);
    const chips = models.slice(0, 8).map(n => `<span class="tm">${esc(n)}</span>`).join('');
    const more = models.length > 8 ? `<div class="tip-more">… 共 ${models.length} 个</div>` : '';
    return `<div class="tip-title"><span class="tip-dot" style="background:var(--gold)"></span>${esc(el.dataset.tip || '模型')}</div>
      <div class="tip-models">${chips}${more}</div>`;
  }
  document.addEventListener('mouseover', e => {
    const el = e.target.closest('[data-tip], [data-tip-key]');
    if(!el) { hideTip(); return; }
    const html = tipContent(el);
    if(html) showTip(html); else hideTip();
  });
  document.addEventListener('mousemove', e => {
    if(!tip.classList.contains('show')) return;
    const pad = 14;
    const tw = 280, th = 150; // 预估尺寸用于边缘翻转
    let x = e.clientX + pad, y = e.clientY + pad;
    if(x + tw > window.innerWidth) x = e.clientX - tw - pad;
    if(y + th > window.innerHeight) y = e.clientY - th - pad;
    tip.style.left = x + 'px';
    tip.style.top = y + 'px';
  });
  document.addEventListener('mouseout', e => {
    if(e.target.closest && !e.target.closest('[data-tip], [data-tip-key]')) hideTip();
  });
  window.addEventListener('scroll', hideTip, true);
  window.addEventListener('resize', hideTip);
})();

/* ===== 模型卡/工具卡悬浮内容库 ===== */
const TIP_DB = {};
MODELS.forEach(m => {
  TIP_DB['model:' + m.id] = () => `
    <div class="tip-title"><span class="tip-dot" style="background:${gradeColor(m.grade)}"></span>${esc(m.name)} · ${m.grade}级 · ${m.cost}费用</div>
    <div class="tip-models">🎯 ${m.scenes.slice(0,4).map(s=>`<span class="tm">${esc(s)}</span>`).join('')}</div>
    ${m.notes ? `<div class="tip-notes">${esc(m.notes)}</div>` : ''}`;
});
TOOLS.forEach(t => {
  const cnt = (t.builtinModels||[]).length;
  TIP_DB['tool:' + t.id] = () => `
    <div class="tip-title"><span class="tip-dot" style="background:var(--cyan)"></span>${esc(t.name)} · ${cnt} 个内置模型</div>
    <div class="tip-models">⚙️ ${esc(t.modelMode)}<br>🎚️ ${esc(t.modelSelect)}</div>
    <div class="tip-notes">⭐ ${esc(t.highlight)}</div>`;
});

/* ===== 主题切换（黑夜/白天）===== */
function currentTheme(){
  return document.documentElement.getAttribute('data-theme') || 'dark';
}
function toggleTheme(){
  const next = currentTheme() === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  try{ localStorage.setItem('llm-theme', next); }catch(e){}
  syncThemeBtn();
}
function syncThemeBtn(){
  const btn = document.getElementById('themeBtn');
  if(!btn) return;
  const dark = currentTheme() === 'dark';
  btn.textContent = dark ? '🌙' : '☀️';
  btn.title = dark ? '切换到白天模式' : '切换到黑夜模式';
}
