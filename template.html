<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>__SITE_TITLE__</title>
<style>
/* ============================================================
   Design System — Dark OLED × Liquid Glass（黑金液态玻璃）
   参考 ui-ux-pro-max: #7 Dark Mode (OLED) + #3 Glassmorphism + #14 Liquid Glass
   主调：深黑 #0A0E1A + 金色 #F0C75E 高级感 + 青色 #53D8FF 数据辅助
   ============================================================ */
:root{
  /* 基底 */
  --bg:#0A0E1A; --bg2:#0E1424; --bg3:#131B2E;
  --card:rgba(255,255,255,.045); --card2:rgba(255,255,255,.075);
  --glass-border:rgba(255,255,255,.10);
  --ink:#F2F4FA; --muted:#8B93A7; --dim:#5B6478;
  /* 品牌 */
  --gold:#F0C75E; --gold2:#FFD98A; --gold-dim:rgba(240,199,94,.14);
  --cyan:#53D8FF; --cyan-dim:rgba(83,216,255,.12);
  /* 数据分级 */
  --s:#F0C75E; --a:#53D8FF; --b:#3DDC97; --c:#6B7A99;
  --s-dim:rgba(240,199,94,.15); --a-dim:rgba(83,216,255,.13);
  --b-dim:rgba(61,220,151,.12); --c-dim:rgba(107,122,153,.12);
  --ok:#3DDC97; --warn:#FFB020; --danger:#FF5470;
  --radius:14px; --radius-lg:20px;
  --shadow:0 8px 40px rgba(0,0,0,.45);
  --font:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
/* 背景光晕：黑金氛围 */
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(900px 500px at 85% -10%, rgba(240,199,94,.07), transparent 60%),
    radial-gradient(700px 500px at -10% 30%, rgba(83,216,255,.05), transparent 55%),
    radial-gradient(600px 400px at 50% 110%, rgba(240,199,94,.04), transparent 60%);}
a{color:var(--cyan);text-decoration:none}

/* ===== Header（玻璃悬浮条）===== */
header{position:sticky;top:12px;z-index:50;max-width:1280px;margin:14px auto 0;padding:16px 24px;
  background:rgba(14,20,36,.72);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);
  border:1px solid var(--glass-border);border-radius:var(--radius-lg);box-shadow:var(--shadow)}
.hd-top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo-badge{width:46px;height:46px;border-radius:13px;flex-shrink:0;
  background:linear-gradient(135deg,#F0C75E,#E89B3C 55%,#B8741F);
  display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;color:#0A0E1A;
  box-shadow:0 0 24px rgba(240,199,94,.35),inset 0 1px 0 rgba(255,255,255,.4)}
h1{font-size:23px;font-weight:800;letter-spacing:.3px;
  background:linear-gradient(90deg,#FFE9A8,#F0C75E 45%,#C9A54A);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hd-meta{margin-top:5px;color:var(--muted);font-size:12.5px;display:flex;gap:16px;flex-wrap:wrap}
.hd-meta .dot{color:var(--gold)}
.hd-stats{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.stat{background:var(--card);border:1px solid var(--glass-border);border-radius:10px;padding:7px 14px;font-size:12.5px;color:var(--muted);backdrop-filter:blur(8px)}
.stat b{color:var(--ink);font-size:15px;margin-right:4px;font-weight:700}
.stat .gs{font-weight:800;margin-right:2px}

/* ===== Filter bar ===== */
.filters{max-width:1280px;margin:14px auto 0;display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:0 6px}
.fgroup{display:flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--glass-border);border-radius:12px;padding:5px 10px;font-size:12.5px;color:var(--muted);backdrop-filter:blur(10px)}
.fgroup>span{opacity:.65;margin-right:2px}
.fgroup .fbtn{cursor:pointer;padding:4px 10px;border-radius:8px;transition:all .18s;white-space:nowrap;background:none;border:none;color:var(--muted);font-size:12.5px;font-family:inherit;line-height:inherit}
.fgroup .fbtn:hover{background:var(--card2);color:var(--ink)}
.fgroup .fbtn.on{background:var(--gold-dim);color:var(--gold2);font-weight:700;box-shadow:inset 0 0 0 1px rgba(240,199,94,.4),0 0 14px rgba(240,199,94,.12)}
.fgroup .fbtn.on.vendor-美国{background:var(--cyan-dim);color:var(--cyan);box-shadow:inset 0 0 0 1px rgba(83,216,255,.4),0 0 14px rgba(83,216,255,.12)}
.fgroup .fbtn.on.vendor-中国{background:rgba(255,84,112,.13);color:#FF8BA0;box-shadow:inset 0 0 0 1px rgba(255,84,112,.4)}
.searchbox{flex:1;min-width:220px;background:var(--card);border:1px solid var(--glass-border);border-radius:12px;padding:9px 16px;color:var(--ink);font-size:13.5px;outline:none;transition:all .2s;backdrop-filter:blur(10px)}
.searchbox::placeholder{color:var(--dim)}
.searchbox:focus{border-color:rgba(240,199,94,.5);box-shadow:0 0 0 3px rgba(240,199,94,.1)}
.sortbox{background:var(--card);border:1px solid var(--glass-border);border-radius:12px;padding:8px 12px;color:var(--ink);font-size:12.5px;outline:none;cursor:pointer;backdrop-filter:blur(10px)}
.sortbox option{background:#0E1424}

/* ===== View tabs ===== */
.viewtabs{max-width:1280px;margin:16px auto 0;padding:0 6px;display:flex;gap:8px}
.viewtab{padding:9px 22px;border-radius:11px;border:1px solid var(--glass-border);background:var(--card);color:var(--muted);cursor:pointer;font-size:13.5px;font-weight:600;transition:all .2s;backdrop-filter:blur(10px)}
.viewtab:hover{color:var(--ink);border-color:rgba(255,255,255,.2)}
.viewtab.on{background:linear-gradient(135deg,rgba(240,199,94,.92),rgba(232,155,60,.92));color:#0A0E1A;font-weight:800;border-color:transparent;box-shadow:0 4px 24px rgba(240,199,94,.3)}

/* ===== Table view ===== */
main{max-width:1280px;margin:16px auto 48px;padding:0 6px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--glass-border);border-radius:var(--radius-lg);background:var(--card);backdrop-filter:blur(14px);box-shadow:var(--shadow)}
table{width:100%;border-collapse:collapse;min-width:1080px;font-size:13px}
thead th{background:rgba(10,14,26,.6);color:var(--muted);text-align:left;padding:12px 14px;font-weight:600;font-size:11.5px;letter-spacing:.6px;text-transform:uppercase;border-bottom:1px solid var(--glass-border);position:sticky;top:0;z-index:5;backdrop-filter:blur(10px)}
tbody td{padding:12px 14px;border-bottom:1px solid rgba(255,255,255,.05);vertical-align:middle}
tbody tr{transition:background .18s;cursor:pointer}
tbody tr:hover{background:rgba(240,199,94,.05)}
tbody tr:last-child td{border-bottom:none}
.m-name{font-weight:700;font-size:13.5px;display:flex;align-items:center;gap:9px;white-space:nowrap}
.m-name .flag{font-size:12px;opacity:.8}
.m-vendor{color:var(--muted);font-size:12px;white-space:nowrap}
.grade{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:9px;font-weight:800;font-size:13px;color:#0A0E1A;flex-shrink:0;box-shadow:0 0 16px rgba(255,255,255,.08)}
.ctx-cell{min-width:132px}
.ctxbar{display:flex;align-items:center;gap:9px}
.ctxbar .bar{width:82px;height:7px;background:rgba(255,255,255,.08);border-radius:4px;overflow:hidden;flex-shrink:0}
.ctxbar .fill{height:100%;background:linear-gradient(90deg,#F0C75E,#E89B3C);border-radius:4px;box-shadow:0 0 8px rgba(240,199,94,.4)}
.ctxbar .txt{font-size:12px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.mm{display:flex;gap:4px;flex-wrap:wrap}
.mm i{font-style:normal;font-size:11px;padding:2px 8px;border-radius:7px;background:var(--card2);border:1px solid var(--glass-border);color:var(--muted);white-space:nowrap}
.mm i.img{color:#B79CFF;border-color:rgba(183,156,255,.35);background:rgba(183,156,255,.08)}
.mm i.aud{color:var(--b);border-color:rgba(61,220,151,.35);background:rgba(61,220,151,.07)}
.mm i.vid{color:#FF8BA0;border-color:rgba(255,139,160,.35);background:rgba(255,139,160,.07)}
.tag{display:inline-block;font-size:11px;padding:2px 9px;border-radius:7px;margin:1px 3px 1px 0;background:rgba(255,255,255,.05);color:#A8B4CC;border:1px solid rgba(255,255,255,.08);white-space:nowrap}
.tag.think{background:rgba(240,199,94,.1);color:var(--gold2);border-color:rgba(240,199,94,.3)}
.cost{font-size:12px;white-space:nowrap;font-weight:600}
.cost.low{color:var(--b)} .cost.mid{color:var(--warn)} .cost.high{color:var(--danger)}
.toolcell{display:flex;gap:4px;flex-wrap:wrap}
.tool-badge{font-size:11px;padding:2px 8px;border-radius:7px;white-space:nowrap;cursor:help;font-weight:600}
.tool-badge.wb{background:rgba(61,220,151,.1);color:#6FE8B8;border:1px solid rgba(61,220,151,.35)}
.tool-badge.qd{background:rgba(255,139,160,.1);color:#FFA3B5;border:1px solid rgba(255,139,160,.35)}
.tool-badge.tr{background:rgba(83,216,255,.1);color:#8FE3FF;border:1px solid rgba(83,216,255,.35)}
.tool-badge.cs{background:rgba(183,156,255,.1);color:#C9B5FF;border:1px solid rgba(183,156,255,.35)}
.tool-badge.cc{background:rgba(255,176,32,.1);color:#FFC966;border:1px solid rgba(255,176,32,.35)}
.tool-badge.gc{background:rgba(83,216,255,.08);color:#9FEAFF;border:1px solid rgba(83,216,255,.3)}
.tool-badge.cx{background:rgba(61,220,151,.08);color:#7FEBC4;border:1px solid rgba(61,220,151,.3)}
.tool-badge.cp{background:rgba(255,255,255,.06);color:#C4CFE4;border:1px solid rgba(255,255,255,.15)}
.tool-badge.ws{background:rgba(240,199,94,.08);color:#FFD98A;border:1px solid rgba(240,199,94,.3)}
.tool-badge.other{background:rgba(255,255,255,.05);color:#A8B4CC;border:1px solid rgba(255,255,255,.1)}

/* ===== Empty state ===== */
.empty{text-align:center;padding:70px 20px;color:var(--muted)}
.empty b{display:block;font-size:17px;color:var(--ink);margin-bottom:6px}

/* ===== Tool view ===== */
.toolgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(350px,1fr));gap:16px}
.toolcard{background:var(--card);border:1px solid var(--glass-border);border-radius:var(--radius-lg);padding:20px;transition:all .25s;backdrop-filter:blur(14px);position:relative;overflow:hidden}
.toolcard::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .3s;
  background:radial-gradient(400px 200px at 90% 0%,rgba(240,199,94,.08),transparent 60%)}
.toolcard:hover{transform:translateY(-4px);border-color:rgba(240,199,94,.35);box-shadow:0 12px 48px rgba(0,0,0,.5),0 0 24px rgba(240,199,94,.06)}
.toolcard:hover::before{opacity:1}
.toolcard h3{font-size:16.5px;font-weight:800;display:flex;align-items:center;gap:9px}
.toolcard .t-sub{color:var(--muted);font-size:12px;margin:3px 0 11px}
.toolcard .t-desc{font-size:13px;color:#C6CEDF;margin-bottom:11px}
.toolcard .t-mode{font-size:12px;color:var(--muted);margin-bottom:8px}
.toolcard .t-mode b{color:var(--gold2);font-weight:600}
.toolcard .t-models{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.toolcard .t-models .tm{font-size:12px;padding:5px 11px;border-radius:9px;background:var(--card2);border:1px solid var(--glass-border);cursor:pointer;transition:all .18s;font-weight:600}
.toolcard .t-models .tm:hover{border-color:var(--gold);color:var(--gold2);transform:translateY(-1px);box-shadow:0 4px 16px rgba(240,199,94,.15)}
.toolcard .t-hl{margin-top:11px;font-size:12px;color:var(--gold2);background:var(--gold-dim);border:1px solid rgba(240,199,94,.25);border-radius:9px;padding:7px 11px;line-height:1.7}
.toolcard .t-src{margin-top:9px;font-size:11px;color:var(--dim)}

/* ===== Modal（玻璃弹窗）===== */
.modal-mask{position:fixed;inset:0;background:rgba(6,9,18,.7);z-index:100;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(10px)}
.modal-mask.show{display:flex}
.modal{background:linear-gradient(165deg,rgba(19,27,46,.96),rgba(14,20,36,.96));border:1px solid rgba(240,199,94,.2);border-radius:22px;max-width:660px;width:100%;max-height:88vh;overflow-y:auto;padding:28px;box-shadow:0 24px 80px rgba(0,0,0,.6),0 0 40px rgba(240,199,94,.05);animation:pop .28s cubic-bezier(.22,1.2,.36,1)}
@keyframes pop{from{transform:scale(.94) translateY(10px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
.modal h2{font-size:21px;font-weight:800;display:flex;align-items:center;gap:11px;margin-bottom:5px}
.modal .m-sub{color:var(--muted);font-size:13px;margin-bottom:18px}
.m-sec{margin:15px 0}
.m-sec h4{font-size:12px;color:var(--gold);margin-bottom:7px;font-weight:700;letter-spacing:.4px;display:flex;align-items:center;gap:6px}
.m-sec .m-row{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.m-sec p{font-size:13.5px;color:#C6CEDF;line-height:1.75}
.m-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:14px 0}
.m-item{background:var(--card);border:1px solid var(--glass-border);border-radius:12px;padding:11px 13px;backdrop-filter:blur(8px)}
.m-item .k{font-size:11px;color:var(--muted)}
.m-item .v{font-size:14.5px;font-weight:700;margin-top:2px}
.modal .close{position:sticky;top:0;float:right;width:34px;height:34px;border-radius:10px;background:var(--card2);border:1px solid var(--glass-border);color:var(--muted);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .18s;margin-left:8px}
.modal .close:hover{color:#fff;border-color:var(--danger);background:rgba(255,84,112,.12)}

/* ===== Footer ===== */
footer{max-width:1280px;margin:0 auto 44px;padding:0 6px;color:var(--dim);font-size:12px}
footer .src{background:var(--card);border:1px solid var(--glass-border);border-radius:14px;padding:14px 18px;margin-top:10px;backdrop-filter:blur(10px)}
footer .src h5{color:var(--muted);font-size:12px;margin-bottom:5px}
footer .src p{margin:2px 0}

/* ===== Responsive ===== */
@media (max-width:900px){
  header{top:8px;margin:8px 10px 0;padding:14px 16px}
  h1{font-size:18px}
  .filters{padding:0 10px}
  main{padding:0 10px}
  .hd-meta{flex-direction:column;gap:4px}
  .toolgrid{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<header>
  <div class="hd-inner">
    <div class="hd-top">
      <div class="logo-badge">AI</div>
      <div>
        <h1>__SITE_TITLE__</h1>
        <div class="hd-meta">
          <span>数据更新：<span class="dot">__UPDATED__</span></span>
          <span>来源：各厂商官方文档 / 官网</span>
          <span>点行查看详情 · 支持筛选排序</span>
        </div>
      </div>
    </div>
    <div class="hd-stats" id="hdStats"></div>
  </div>
</header>

<div class="filters">
  <div class="searchbox-wrap" style="flex:1;min-width:220px">
    <input class="searchbox" id="searchBox" placeholder="🔍 搜索模型名 / 厂商 / 擅长领域，如 Kimi、1M、前端、办公…">
  </div>
  <div class="fgroup" id="gradeFilter"></div>
  <div class="fgroup" id="vendorFilter"></div>
  <div class="fgroup" id="mmFilter"></div>
  <select class="sortbox" id="sortBox">
    <option value="grade">按综合等级</option>
    <option value="context">按上下文长度</option>
    <option value="name">按名称</option>
  </select>
</div>

<div class="viewtabs">
  <div class="viewtab on" id="tabModels" onclick="showView('models')">📊 模型总览</div>
  <div class="viewtab" id="tabTools" onclick="showView('tools')">🛠️ Agent 工具内置模型</div>
</div>

<main id="main"></main>

<footer>
  <div class="src">
    <h5>📌 数据说明</h5>
    <p>· 数据截至 __UPDATED__，来自各厂商官方文档/官网（WorkBuddy / Qoder / TRAE / Cursor / Anthropic / OpenAI / Google 等）。</p>
    <p>· 等级分级为综合参考（能力/速度/生态），非官方评分；上下文、多模态、费用以官方最新为准。</p>
    <p>· 模型能力更新快，若与官方有出入请以厂商为准。</p>
  </div>
</footer>

<div class="modal-mask" id="modalMask" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modalBody"></div>
</div>

<script id="app-data" type="application/json">__DATA_JSON__</script>
<script>
__APP_JS__
</script>
</body>
</html>
